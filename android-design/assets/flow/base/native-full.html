<!-- BASE · Full-screen native ad (412x917; measured CV SDK 107:20844 — 8 immersive + 5 contained variants, TM 1262:22056).
     immersive (default): creative from y33, top scrim 132 + bottom scrim 194, header at y781 (logo 44, tag + headline
     Inter 600 12/14 white, body 10/12), CTA 372x52 at y841; top area = countdown pill (?state=default), X 36 at x356 y56
     (?state=closable), or progress bar "Ad 1/2" (?state=progress). contained (?state=contained): blurred creative,
     240 square media, 80 advertiser icon, white 372x124 text card with a 48 "Continue" CTA. Inserted after OB1 and OB3. -->
<style>.screen { background: #101012; }</style></head><body>
<div class="screen overlay-bars on-dark">
  <div class="ad ad-full" data-when="!contained">
    <div class="creative"></div><div class="scrim-t"></div><div class="scrim-b"></div>
    <span class="timer" data-when="default">Còn 2 giây</span>
    <span class="x" data-when="closable"><span class="ms s20">close</span></span>
    <span class="progress" data-when="progress"><i></i></span>

    <div class="cta">Cài đặt</div>
  </div>
  <div class="ad ad-full contained" data-when="contained">
    <div class="creative" style="background:linear-gradient(160deg,#C9D6E8,#E9D7EF)"></div><div class="icon80"></div>
    <span class="x" style="top:93px"><span class="ms s20">close</span></span><div class="sq"></div>
    <div class="card"><div><span class="tag">Ad</span><span class="hl">Tên ứng dụng quảng cáo</span></div><div class="bd">Mô tả ngắn của quảng cáo.</div><div class="cta">Continue</div></div>
  </div>
  <div class="statusbar on-dark" style="height:52px;padding:0 24px"><span>9:41</span><span class="sys"><span class="ms fill">signal_cellular_alt</span><span class="ms fill">wifi</span><span class="ms fill">battery_full</span></span></div>
  <div class="gesturebar"></div>
</div></body></html>
